# AstroShield AI en contenedores:
#   docker compose up -d --build          → app en http://localhost:8080 · API en http://localhost:8000/docs
#   docker compose run --rm backend python -m backend.train   → entrena el modelo de IA (una vez)
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: astroshield-backend
    ports:
      - "8000:8000"
    environment:
      ASTROSHIELD_JWT_SECRET: ${ASTROSHIELD_JWT_SECRET:-cambia-este-secreto}
      ASTROSHIELD_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      # CSV, base de usuarios y modelos entrenados persisten fuera del contenedor.
      - ./backend/data:/app/backend/data
      - ./backend/app/models:/app/backend/app/models

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    image: astroshield-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
